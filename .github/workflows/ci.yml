name: ci
on:
  pull_request:
  push:
    branches: [main]
  # new CVEs appear without any push: the audit and the image scan also run weekly on main
  schedule:
    - cron: "17 5 * * 1"

# read-only token: no job here writes to the repository
permissions:
  contents: read

# agents push several times in a row: only the newest run of a PR matters; main keeps every run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# runners pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install Chromium on;
# move together with the Playwright version (Dependabot bumps it)
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: PYTHONPATH=app lint-imports --no-cache
      - run: pytest --cov --cov-report=term-missing

  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc -p .
      # app/static/vendor/codemirror*: byte for byte what make vendor builds from the lock, and it loads with no bare import
      - run: node scripts/vendor_codemirror.mjs --check
      - run: npm run test:codemirror
      - run: npx playwright install --with-deps chromium
      - run: npm run test:render
      - run: npm run test:parity
      - run: npm run test:shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-screenshots
          path: test-results/preview/

  e2e:
    runs-on: ubuntu-24.04
    needs: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm ci && npx playwright install --with-deps chromium
      # the source tabs' suggestions on the spec GET /api/spec gives: Python from requirements.txt, so here and not in js
      - run: PYTHON=python npm run test:completion
      # «В HTML» on Telegram's own blocks: needs the studio's Python (spec/convert.py) and a browser, both are here
      - run: PYTHON=python npm run test:export
      # the stand of make e2e-local: mock Telegram and a studio with an empty DATA_DIR; their log tails on a failure
      - run: scripts/e2e_local.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-screenshots
          path: test-results/ui/

  # known vulnerabilities in pinned dependencies, and secrets anywhere in the history
  # (pre-commit runs gitleaks too, but agents and the web editor do not run pre-commit)
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install pip-audit && pip-audit -r requirements.txt -r requirements-dev.txt
      # what the image installs, transitive packages included
      - run: pip-audit --require-hashes --disable-pip -r requirements.lock
      - run: npm audit --audit-level=high
      - name: gitleaks (same version as .pre-commit-config.yaml)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --no-banner

  # the image builds, starts without network, stops gracefully and keeps its data; critical fixable CVEs fail the build
  docker:
    runs-on: ubuntu-24.04
    needs: python
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t rich-studio .
      # as on the server, with --network none: answers, docker stop exits 0, a draft outlives the restart;
      # the container's log tail on a failure
      - name: smoke test
        run: scripts/image_smoke.sh
      - name: image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.58.1 image --ignorefile /.trivyignore \
            --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress rich-studio
