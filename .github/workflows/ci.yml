name: ci
on:
  pull_request:
  push:
    branches: [main]
  # new CVEs appear without any push: the audit and the image scan also run weekly on main
  schedule:
    - cron: "17 5 * * 1"

# read-only token: no job here writes to the repository
permissions:
  contents: read

# agents push several times in a row: only the newest run of a PR matters; main keeps every run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# runners pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install Chromium on;
# move together with the Playwright version (Dependabot bumps it)
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: PYTHONPATH=app lint-imports --no-cache
      - run: pytest --cov --cov-report=term-missing

  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc -p .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:render
      - run: npm run test:parity
      - run: npm run test:shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-screenshots
          path: test-results/preview/

  e2e:
    runs-on: ubuntu-24.04
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm ci && npx playwright install --with-deps chromium
      - name: start mock Telegram and studio
        run: |
          (cd tests && uvicorn mock_telegram:app --port 8081 &)
          mkdir -p /tmp/rs-data
          (cd app && DATA_DIR=/tmp/rs-data TG_BOT_TOKEN=1:x TG_API_BASE=http://127.0.0.1:8081 \
             TG_DEFAULT_CHAT=@test TG_PREVIEW_CHAT=777 SPEC_URL=http://127.0.0.1:9/off \
             uvicorn main:app --port 8080 &)
          for i in $(seq 30); do curl -sf localhost:8080/api/config && break; sleep 1; done
      - run: node tests/e2e_ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-screenshots
          path: test-results/ui/

  # known vulnerabilities in pinned dependencies, and secrets anywhere in the history
  # (pre-commit runs gitleaks too, but agents and the web editor do not run pre-commit)
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pip-audit && pip-audit -r requirements.txt -r requirements-dev.txt
      # what the image installs, transitive packages included
      - run: pip-audit --require-hashes --disable-pip -r requirements.lock
      - run: npm audit --audit-level=high
      - name: gitleaks (same version as .pre-commit-config.yaml)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --no-banner

  # the image builds, starts and answers; critical fixable CVEs in it fail the build
  docker:
    runs-on: ubuntu-24.04
    needs: python
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rich-studio .
      - name: smoke test
        run: |
          # as on the server: read-only root, no capabilities, its own uid
          docker run -d --name rs -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -e SPEC_URL=http://127.0.0.1:9/off -e TG_UPDATES=off rich-studio
          for i in $(seq 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/api/config
          curl -sf localhost:8080/ -o /dev/null
          test "$(docker inspect -f '{{.State.Running}}' rs)" = true
          test "$(docker exec rs id -u)" = 10001
      - if: failure()
        run: docker logs rs
      - name: image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image \
            --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress rich-studio
