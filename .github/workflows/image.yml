name: image
# The studio's image in GHCR for the server (deploy/docker-compose.yml), for amd64 and arm64 (QEMU), with build
# provenance and an SBOM from buildx. Not on every push to main: QEMU arm64 builds burn Actions minutes and there is
# no server yet. Run it by hand (Actions → image → Run workflow, or `gh workflow run image.yml`) for :main and :<sha>,
# or push a v* tag for :<version> and :<sha>.
# No actions/attest-build-provenance: artifact attestations in a private repo need GitHub Enterprise Cloud.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # arm64 RUN steps on the amd64 runner
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}     # lowercased: ghcr.io/nikitacodesave/rich-studio
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
