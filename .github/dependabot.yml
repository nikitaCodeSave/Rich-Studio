# Weekly updates, one grouped PR per ecosystem, so agents' PRs do not drown in bumps.
# Merge order matters as for any PR: rebase on main, make check green.
version: 2
updates:
  # requirements.lock (what the image installs) is not bumped by Dependabot: after its PR run `make lock`
  # and push the lock, tests/test_lock.py fails until then
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      js: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker-compose   # deploy/: Caddy and Litestream, tag and digest together
    directory: /deploy
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
