services:
  rich-studio:
    build: .
    container_name: rich-studio
    env_file: .env
    # as the host user: ./data and the database stay yours (make token works on them); not 1000? STUDIO_UID=$(id -u)
    # and STUDIO_GID=$(id -g) in .env. The image itself defaults to uid 10001 (the server, deploy/)
    user: "${STUDIO_UID:-1000}:${STUDIO_GID:-1000}"
    ports:
      - "127.0.0.1:7424:8080"   # только с этого компьютера; порт хоста 7424, а не 8080: тот часто занят
    volumes:
      - ./data:/data            # черновики, посты, файлы, кэш спецификации
    restart: unless-stopped
    stop_grace_period: 60s    # uvicorn ждёт запросы до 10 с, затем начатые отправки до 30 с (services/loops.py)
    logging:                    # вывод контейнера (docker logs) не растёт больше 3 × 10 МБ
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
