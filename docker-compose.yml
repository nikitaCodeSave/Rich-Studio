services:
  rich-studio:
    build: .
    container_name: rich-studio
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"   # только с этого компьютера
    volumes:
      - ./data:/data            # черновики, посты, файлы, кэш спецификации
    restart: unless-stopped
    stop_grace_period: 45s    # начатые отправки успевают закончиться (до 30 с), см. services/loops.py
    logging:                    # вывод контейнера (docker logs) не растёт больше 3 × 10 МБ
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
