services:
  rich-studio:
    build: .
    container_name: rich-studio
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"   # только с этого компьютера
    volumes:
      - ./data:/data            # черновики, посты, файлы, кэш спецификации
    restart: unless-stopped
    stop_grace_period: 60s    # uvicorn ждёт запросы до 10 с, затем начатые отправки до 30 с (services/loops.py)
    logging:                    # вывод контейнера (docker logs) не растёт больше 3 × 10 МБ
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
